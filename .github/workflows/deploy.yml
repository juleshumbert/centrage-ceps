name: Deploy to Firebase

# Deploie l'IHM (Hosting, site ceps09-centrage) et la Cloud Function `placement`
# (codebase `centrage`) a chaque push sur main. Le binaire Linux statique du solveur est
# construit ici puis copie dans functions/bin/ avant le deploiement.

on:
  push:
    branches: [main]
    paths-ignore: ['avions/**', 'heuristique_remplissage/**', 'reference/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-centrage-prod
  cancel-in-progress: false

env:
  HIGHS_TAG: v1.9.0
  JSON_VERSION: v3.11.3

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---- solveur : binaire Linux statique pour la Cloud Function ----
      - name: Sources tierces (HiGHS, nlohmann/json)
        working-directory: solveur
        run: |
          git clone -q --depth 1 --branch "$HIGHS_TAG" https://github.com/ERGO-Code/HiGHS.git HiGHS
          curl -sSL -o json.hpp "https://github.com/nlohmann/json/releases/download/$JSON_VERSION/json.hpp"
      - name: Cache du build HiGHS
        uses: actions/cache@v4
        with:
          path: solveur/build/HiGHS
          key: highs-linux-x86_64-${{ env.HIGHS_TAG }}-${{ hashFiles('solveur/CMakeLists.txt') }}
      - name: Compiler le solveur (statique)
        working-directory: solveur
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPLACEMENT_STATIC=ON
          cmake --build build --target placement --parallel 4
          ./tests/smoke.sh
          mkdir -p ../functions/bin && cp build/placement ../functions/bin/placement
          file ../functions/bin/placement

      # ---- tests : moteur client et garde-fous de la fonction ----
      - name: Tests web + functions
        run: |
          npm test --prefix web
          npm ci --prefix functions
          npm test --prefix functions

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      # IMPORTANT : le projet Firebase est PARTAGE avec les apps soeurs (planning, manex,
      # briefing, admin, simu...). Le deploiement reste strictement scope a hosting:centrage
      # + functions:centrage (codebase dedie). Ne jamais lancer un `firebase deploy` nu ni un
      # `--only functions` sans filtre de codebase depuis ce depot.
      - name: Deploy (hosting centrage + functions centrage)
        run: firebase deploy --only hosting:centrage,functions:centrage --project ${{ vars.FIREBASE_PROJECT_ID }} --non-interactive
